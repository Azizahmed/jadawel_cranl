<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جداول — منصة سعودية لإدارة البيانات والعمليات</title>
<meta name="description" content="جداول: منصة سحابية سعودية بديلة عن Airtable — قواعد بيانات ولوحات معلومات بواجهة عربية كاملة، استضافة داخل المملكة ومتوافقة مع معايير NDMO.">
<meta property="og:title" content="جداول — منصة سعودية لإدارة البيانات">
<meta property="og:description" content="مرونة عالمية، امتثال سعودي. بياناتك داخل المملكة.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --ink:#202128; --muted:#6e6e69; --line:#e6e6e1;
  --green:#2e7d5b; --green-dark:#266a4d; --green-tint:#eaf4ee; --green-line:#cfe5d9;
  --amber:#b97f24; --amber-tint:#f7efe0; --gray-tint:#f0f0ec; --radius:14px;
  --shadow:0 12px 32px rgba(32,33,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;overflow-x:hidden}
body,.browser,.mini-table{font-feature-settings:"tnum"}
img,svg{display:block}
a{color:inherit;text-decoration:none}
.container{max-width:1120px;margin-inline:auto;padding-inline:24px}
section{scroll-margin-top:84px}
::selection{background:var(--green-tint);color:var(--green-dark)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;font-weight:600;font-size:15px;padding:12px 22px;border:1px solid transparent;cursor:pointer;transition:.2s;font-family:inherit}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#c9c9c2;transform:translateY(-1px)}
.btn-sm{padding:8px 16px;font-size:14px}
.btn-light{background:#fff;color:var(--green-dark)}
.btn-light:hover{transform:translateY(-1px)}
.btn-outline-light{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn-outline-light:hover{background:rgba(255,255,255,.1)}

/* ---------- navbar ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(247,247,245,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:box-shadow .25s}
.nav.scrolled{box-shadow:0 6px 24px rgba(32,33,40,.07)}
.nav-inner{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{height:26px;width:auto;color:var(--ink)}
.latin-name{font-weight:700;font-size:15px;letter-spacing:.4px;color:var(--ink)}
.links{display:flex;gap:2px}
.links a{padding:8px 12px;border-radius:8px;color:var(--muted);font-size:14.5px;font-weight:500}
.links a:hover{color:var(--ink);background:var(--gray-tint)}
.nav-actions{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.lang-toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.lang-toggle:hover{border-color:#c9c9c2}
.login-link{color:var(--muted);font-size:14.5px;font-weight:500;padding:8px 6px}
.login-link:hover{color:var(--ink)}

/* ---------- hero ---------- */
.hero{padding:84px 0 30px;text-align:center;position:relative}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--green-line);background:var(--green-tint);color:var(--green-dark);border-radius:999px;font-size:13px;font-weight:600}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.35;font-weight:700;max-width:820px;margin:22px auto 16px}
.hero .sub{color:var(--muted);font-size:18px;line-height:2;max-width:740px;margin:0 auto 30px}
.hero-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:16px;color:var(--muted);font-size:13px}

/* ---------- app mockup ---------- */
.mockup-wrap{margin-top:60px;position:relative}
.mockup-wrap::before{content:"";position:absolute;inset:-60px -40px;background:radial-gradient(55% 55% at 50% 42%,rgba(46,125,91,.13),transparent 72%);z-index:0;pointer-events:none}
.browser{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px rgba(32,33,40,.10);overflow:hidden;text-align:start}
.browser-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fbfbfa}
.dot{width:10px;height:10px;border-radius:50%;background:#e2e2dc}
.url-pill{margin-inline-start:8px;flex:1;max-width:340px;background:var(--gray-tint);border-radius:8px;padding:5px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.url-pill svg{width:12px;height:12px;color:var(--green)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:430px}
.app-side{border-inline-end:1px solid var(--line);background:#fbfbfa;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.side-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--muted);font-size:14px}
.side-item svg{width:17px;height:17px;flex:none}
.side-item.active{background:var(--green-tint);color:var(--green-dark);font-weight:600}
.side-add{margin-top:8px;color:var(--green);font-weight:600}
.app-main{padding:22px 26px}
.app-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.app-top b{font-size:16px}
.app-top .btn{margin-inline-start:auto}
.row-item{display:flex;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.row-icon{width:42px;height:42px;flex:none;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:var(--muted);background:#fff}
.row-icon svg{width:19px;height:19px}
.row-title{font-weight:600;font-size:14.5px}
.row-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.stat{background:#f4f4f1;border-radius:11px;padding:14px 16px}
.stat span{color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:22px;margin-top:4px}

/* ---------- trust strip ---------- */
.trust{padding:44px 0 6px}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trust-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.trust-card .ic{width:38px;height:38px;border-radius:10px;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;margin-bottom:12px}
.trust-card .ic svg{width:19px;height:19px}
.trust-card b{font-size:15px}
.trust-card p{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.8}

/* ---------- section headers ---------- */
.sec-head{text-align:center;max-width:720px;margin:0 auto 48px}
.kicker{color:var(--green);font-weight:700;font-size:14px}
.sec-head h2{font-size:clamp(26px,3.4vw,38px);line-height:1.5;margin:10px 0 12px}
.sec-head .section-sub{color:var(--muted);font-size:16.5px;line-height:1.9}

/* ---------- features ---------- */
.features{padding:80px 0 30px}
.feature{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center;padding:34px 0}
.feature h3{font-size:24px;line-height:1.5;margin-bottom:10px}
.feature .fd{color:var(--muted);font-size:16px;line-height:1.95;margin-bottom:16px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14.5px;color:#3d3d42}
.check .tick{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:3px}
.feature.rev .feature-visual{order:-1}
.feature-visual{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}

/* mini table (visual 1) */
.mini-tabs{display:flex;gap:6px;margin-bottom:14px}
.mini-tabs span{padding:6px 14px;border-radius:8px;font-size:12.5px;color:var(--muted);background:var(--gray-tint)}
.mini-tabs span.on{background:var(--green-tint);color:var(--green-dark);font-weight:600}
.mini-table{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.mt-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.mt-row:last-child{border-bottom:0}
.mt-head{background:#fbfbfa;color:var(--muted);font-weight:600;font-size:12px}
.chip{display:inline-flex;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.chip.g{background:var(--green-tint);color:var(--green-dark)}
.chip.a{background:var(--amber-tint);color:var(--amber)}
.chip.n{background:var(--gray-tint);color:var(--muted)}

/* excel visual (2) */
.ex-flow{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.ex-box{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:#fbfbfa}
.ex-box .file{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;direction:ltr}
.ex-box .file svg{width:16px;height:16px;color:var(--green)}
.ex-box small{display:block;color:var(--muted);margin-top:10px;font-size:12px}
.ex-arrow{color:var(--green);width:26px;height:26px}
[dir="ltr"] .ex-arrow{transform:scaleX(-1)}
.ex-ok{margin-top:12px;display:flex;justify-content:center}

/* mcp visual (3) */
.code-card{background:#202128;border-radius:12px;padding:18px 20px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:2;direction:ltr;text-align:left;color:#c9c9d2;overflow:hidden}
.code-card .cmt{color:#7a7a86}
.code-card .ok{color:#7fd0a8}
.code-card .cmd{color:#fff}
.mcp-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mcp-chips span{background:var(--green-tint);color:var(--green-dark);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}

/* mini grid */
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:44px}
.mini-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.mini-card .ic{width:36px;height:36px;border-radius:9px;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;margin-bottom:12px}
.mini-card .ic svg{width:18px;height:18px}
.mini-card b{font-size:15px}
.mini-card p{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.8}

/* ---------- security ---------- */
.security{background:var(--green-tint);border-block:1px solid var(--green-line);padding:80px 0;margin-top:60px}
.sec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sec-card{background:var(--surface);border:1px solid var(--green-line);border-radius:var(--radius);padding:22px}
.sec-card .ic{width:38px;height:38px;border-radius:10px;background:var(--green-tint);color:var(--green-dark);display:grid;place-items:center;margin-bottom:12px}
.sec-card .ic svg{width:19px;height:19px}
.sec-card b{font-size:15.5px}
.sec-card p{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.85}

/* ---------- steps ---------- */
.steps{padding:84px 0}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;position:relative}
.step .num{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:16px}
.step b{font-size:17px}
.step p{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.9}

/* ---------- pricing ---------- */
.pricing{padding:0 0 84px}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:880px;margin-inline:auto}
.price-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px;position:relative;display:flex;flex-direction:column}
.price-card.featured{border-color:var(--green);box-shadow:0 20px 50px rgba(46,125,91,.12)}
.p-badge{position:absolute;top:-14px;inset-inline-start:28px;background:var(--green);color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:700}
.price-card h3{font-size:20px}
.p-note{color:var(--muted);font-size:13.5px;margin-top:4px}
.p-amount{display:flex;align-items:baseline;gap:8px;margin:22px 0 4px}
.p-amount b{font-size:44px;line-height:1}
.p-amount span{color:var(--muted);font-size:14px}
.p-trial{color:var(--green-dark);background:var(--green-tint);display:inline-flex;align-self:flex-start;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;margin-bottom:18px}
.p-feats{margin:14px 0 26px;flex:1}
.price-card .btn{width:100%}
.p-sub-cta{margin-top:10px;text-align:center;color:var(--green-dark);font-weight:600;font-size:14px}
.p-sub-cta:hover{text-decoration:underline}

/* ---------- faq ---------- */
.faq{padding:0 0 90px}
.faq-list{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.faq-list details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 20px;transition:border-color .2s}
.faq-list details[open]{border-color:var(--green-line)}
.faq-list summary{padding:18px 0;cursor:pointer;font-weight:600;font-size:15.5px;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.faq-list summary::-webkit-details-marker{display:none}
.faq-list summary::after{content:"+";color:var(--green);font-size:20px;font-weight:700;transition:transform .2s;flex:none}
.faq-list details[open] summary::after{transform:rotate(45deg)}
.faq-list .a{color:var(--muted);font-size:14.5px;line-height:2;padding-bottom:20px}

/* ---------- cta band ---------- */
.cta-band{background:var(--green);border-radius:22px;color:#fff;text-align:center;padding:60px 32px;margin-bottom:90px;position:relative;overflow:hidden}
.cta-band::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 110%,rgba(255,255,255,.14),transparent 60%)}
.cta-band .logo{height:30px;width:auto;color:#fff;margin:0 auto 18px}
.cta-band h2{font-size:clamp(24px,3vw,34px);line-height:1.5;position:relative}
.cta-band p{opacity:.9;margin:10px auto 28px;max-width:560px;position:relative}
.cta-band .hero-ctas{position:relative}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);background:var(--bg);padding:56px 0 30px}
.f-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px}
.f-brand .logo{height:24px;width:auto;color:var(--ink)}
.f-brand p{color:var(--muted);font-size:13.5px;margin-top:14px;max-width:280px;line-height:1.9}
.f-col b{font-size:14px;display:block;margin-bottom:14px}
.f-col a{display:block;color:var(--muted);font-size:13.5px;margin-bottom:10px}
.f-col a:hover{color:var(--green-dark)}
.f-bottom{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}

/* ---------- reveal ---------- */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- responsive ---------- */
@media(max-width:960px){
  .links{display:none}
  .trust-grid,.sec-grid,.mini-grid,.steps-grid{grid-template-columns:1fr 1fr}
  .feature,.feature.rev{grid-template-columns:1fr;gap:26px}
  .feature.rev .feature-visual{order:0}
  .app{grid-template-columns:1fr}
  .app-side{display:none}
  .f-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  .trust-grid,.sec-grid,.mini-grid,.steps-grid,.price-grid,.stats,.f-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .login-link{display:none}
  .ex-flow{grid-template-columns:1fr}
  .ex-arrow{transform:rotate(90deg)}
  [dir="ltr"] .ex-arrow{transform:rotate(90deg)}
}
</style>
</head>

let lang = "ar";
function applyLang(l){
  lang = l;
  const d = I18N[l];
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if(d[k] !== undefined) el.textContent = d[k];
  });
  document.documentElement.lang = l;
  document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  document.title = d.docTitle;
  document.querySelector('meta[name="description"]').content = d.docDesc;
  document.getElementById("langToggle").textContent = l === "ar" ? "EN" : "عربي";
}
document.getElementById("langToggle").addEventListener("click", ()=> applyLang(lang === "ar" ? "en" : "ar"));
applyLang("ar");

/* navbar shadow */
const nav = document.getElementById("nav");
addEventListener("scroll", ()=> nav.classList.toggle("scrolled", scrollY > 8), {passive:true});

/* subtle reveal on scroll */
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }), {threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
