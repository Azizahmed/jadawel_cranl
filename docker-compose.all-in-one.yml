# The simplest way of running Jadawel with docker compose: one container for everything.
#
# There is no published registry image for Jadawel, so build it first with:
#   just build all-in-one latest
# then start it with:
#   JADAWEL_VERSION=latest docker compose -f docker-compose.all-in-one.yml up -d
#
# NOTE: the `baserow` service/container/volume names and the `/baserow/data` mount path
# are load-bearing (the image entrypoint and named volumes depend on them) and are
# deliberately left unchanged.
services:
  baserow:
    container_name: baserow
    image: jadawel/jadawel:${JADAWEL_VERSION:-latest}
    environment:
      JADAWEL_PUBLIC_URL: 'http://localhost'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - baserow_data:/baserow/data
volumes:
  baserow_data:
