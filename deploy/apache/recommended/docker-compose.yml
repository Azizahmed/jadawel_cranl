# This compose file is for testing our example Apache configuration locally.
# To test you have to add `127.0.0.1 example.localhost` to your /etc/hosts.
services:
  apache:
    build:
      context: .
    ports:
      - '80:80'
    depends_on: [jadawel]
  jadawel:
    image: jadawel/jadawel:latest
    environment:
      # Apache is configured to use the docker network to reach this Jadawel service.
      # No need to use JADAWEL_EXTRA_ALLOWED_HOSTS if your Apache can access your
      # Jadawel normally on a port.
      JADAWEL_EXTRA_ALLOWED_HOSTS: "jadawel"
      JADAWEL_PUBLIC_URL: http://example.localhost
    volumes:
      - jadawel_data:/jadawel/data
volumes:
  jadawel_data:
