
<VirtualHost *:80>
ProxyPreserveHost On

# Replace with your sub domain
ServerName example.localhost

# Properly upgrade ws connections made by Jadawel to the /ws path for realtime collab.
RewriteEngine on
RewriteCond ${HTTP:Upgrade} websocket [NC]
RewriteCond ${HTTP:Connection} upgrade [NC]
RewriteRule .* "ws://jadawel:80/$1" [P,L,END]
ProxyPass /ws ws://jadawel:80/ws
ProxyPassReverse /ws ws://jadawel:80/ws

# Send everything else to Jadawel as normal.
ProxyPass / http://jadawel:80/
ProxyPassReverse / http://jadawel:80/

</VirtualHost>
