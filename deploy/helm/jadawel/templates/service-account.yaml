{{- if .Values.global.jadawel.serviceAccount.shared -}}
{{- if .Values.global.jadawel.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jadawel.global.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jadawel.global.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "2"
  {{- with .Values.global.jadawel.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.global.jadawel.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
