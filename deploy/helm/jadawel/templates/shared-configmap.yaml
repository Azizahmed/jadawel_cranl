apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.jadawel.sharedConfigMap }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "2"
  labels:
    {{- include "jadawel.global.labels" . | nindent 4 }}
data:
  PUBLIC_BACKEND_URL: https://{{ .Values.global.jadawel.backendDomain }}
  PUBLIC_WEB_FRONTEND_URL: https://{{ .Values.global.jadawel.domain }}
  PRIVATE_BACKEND_URL: http://{{ lower .Release.Name }}-jadawel-backend-wsgi
  {{- range $key, $val := .Values.sharedConfigMap }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
