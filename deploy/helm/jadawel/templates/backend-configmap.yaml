apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.jadawel.backendConfigMap }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: "2"
  labels:
    {{- include "jadawel.global.labels" . | nindent 4 }}
data:
{{- if .Values.postgresql.enabled }}
  DATABASE_USER: {{ include "jadawel.global.postgresql.username" . | quote }}
{{- end }}
{{- if .Values.minio.enabled }}
  AWS_S3_VERIFY: "false"
  AWS_ENDPOINT_URL: {{ printf "http://%s:%.f" (include "common.names.fullname" .Subcharts.minio) .Values.minio.service.ports.api }}
  AWS_STORAGE_BUCKET_NAME: {{ (index .Values.minio.provisioning.buckets 0).name }}
  AWS_S3_CUSTOM_DOMAIN: {{ .Values.global.jadawel.objectsDomain }}/{{ (index .Values.minio.provisioning.buckets 0).name }}
  AWS_S3_REGION_NAME: "us-east-1"
{{- end }}
{{- if .Values.global.jadawel.assistantLLMModel }}
  JADAWEL_ENTERPRISE_ASSISTANT_LLM_MODEL: "{{ .Values.global.jadawel.assistantLLMModel }}"
{{- end }}
{{- if (index .Values "jadawel-embeddings").enabled }}
  JADAWEL_EMBEDDINGS_API_URL: http://{{ include "jadawel.fullname" (index .Subcharts "jadawel-embeddings") }}
{{- end }}
{{- range $key, $val := .Values.backendConfigMap }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
