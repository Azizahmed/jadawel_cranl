{{- if .Values.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jadawel.fullname" . }}
  namespace: {{ include "jadawel.namespace" . }}
  labels:
    {{- include "jadawel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "jadawel.selectorLabels" . | nindent 4 }}
{{- end }}
