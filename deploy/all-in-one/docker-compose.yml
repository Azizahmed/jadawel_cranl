services:
  # A dev / testing /example compose file for quickly setting up an all in one
  jadawel_all_in_one:
    image: jadawel/jadawel:${JADAWEL_VERSION:-latest}
    build:
      dockerfile: $PWD/deploy/all-in-one/Dockerfile
      context: $PWD
      target: prod
    environment:
      EMAIL_SMTP: 'yes'
      EMAIL_SMTP_HOST: 'mailhog'
      EMAIL_SMTP_PORT: '1025'
      JADAWEL_PUBLIC_URL:
      MEDIA_URL:
      JADAWEL_FILE_UPLOAD_ACTIVE_CONTENT_POLICY:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - jadawel_all_in_one_data:/jadawel/data
    healthcheck:
      test: [ "CMD-SHELL", "/jadawel/backend/docker/docker-entrypoint.sh backend-healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
    stdin_open: true
    tty: true
  mailhog:
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "8025:8025" # web ui
volumes:
  jadawel_all_in_one_data:
