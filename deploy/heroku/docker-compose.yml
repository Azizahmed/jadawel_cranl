services:
  # A dev / testing /example compose file for testing heroku image works without
  # heroku
  jadawel_heroku:
    image: jadawel_heroku
    build:
      dockerfile: $PWD/heroku.Dockerfile
      context: $PWD
      args:
        - FROM_IMAGE=jadawel
    environment:
      - PORT=80
      - JADAWEL_PUBLIC_URL=http://localhost
      - DATABASE_URL=postgresql://jadawel:jadawel@db:5432/jadawel
      - HEROKU_APP_NAME=test
      - REDIS_URL=redis://:jadawel@redis:6379
      - MAILGUN_DOMAIN=mailhog
      - MAILGUN_SMTP_SERVER=mailhog
      - MAILGUN_SMTP_LOGIN=mailhog
      - MAILGUN_SMTP_PASSWORD=mailhog
      - MAILGUN_SMTP_PORT=1025
      - JADAWEL_AMOUNT_OF_WORKERS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - jadawel_heroku_data:/jadawel/data
    healthcheck:
      test: [ "CMD-SHELL", "/jadawel/backend/docker/docker-entrypoint.sh backend-healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
    stdin_open: true
    tty: true
  db:
    # Please ensure the postgres-client's major version in the backend image is kept in
    # sync with this major version so pg_dump remains compatible.
    image: postgres:15
    environment:
      - POSTGRES_USER=${DATABASE_USER:-jadawel}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-jadawel}
      - POSTGRES_DB=${DATABASE_NAME:-jadawel}
    healthcheck:
      test: [ "CMD-SHELL", "su postgres -c \"pg_isready -U ${DATABASE_USER:-jadawel}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - heroku_pgdata:/var/lib/postgresql/data
  mailhog:
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "8025:8025" # web ui
  redis:
    image: redis:6
    command: redis-server --requirepass ${REDIS_PASSWORD:-jadawel}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]

volumes:
  heroku_pgdata:
  jadawel_heroku_data:
