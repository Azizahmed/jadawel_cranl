services:
  db:
    # use lowest supported version for dev to check compatibility
    image: pgvector/pgvector:pg${POSTGRES_IMAGE_VERSION:-14}
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    command: "${POSTGRES_DEV_EXTRA_ARGS}"
    volumes:
      # Use a different volume in case the Major version is different from the
      # production one to avoid issues.
      - pgdatadev:/var/lib/postgresql/data

  redis:
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${DEBUG_REDIS_PORT:-6379}:6379"

  # Override with the dev caddy file which switches Caddy to only be the media file
  # server in the dev env. Devs will instead directly connect to the backend and
  # web frontend services.
  caddy:
    volumes:
      - $PWD/Caddyfile.dev:/etc/caddy/Caddyfile

  backend:
    image: jadawel_backend:dev
    environment:
      - JADAWEL_BACKEND_DEBUGGER_ENABLED
      - JADAWEL_BACKEND_DEBUGGER_PORT=${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_EMBEDDINGS_API_URL=${JADAWEL_EMBEDDINGS_API_URL}
      # Off for local dev, which is plain http. The production compose defaults
      # it on, and with it come Secure cookies and HSTS — neither of which a
      # browser will honour over http://localhost, and HSTS on localhost sticks
      # around long after you stop working on this.
      - JADAWEL_ENABLE_SECURE_PROXY_SSL_HEADER=
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:8000:8000"
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}:${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}"
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      - ./deploy/plugins/:/jadawel/plugins/
      - ./tests:/jadawel/tests
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  web-frontend:
    image: jadawel_web-frontend:dev
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    command: "nuxt-dev"
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ./web-frontend:/jadawel/web-frontend
      - ./tests/:/jadawel/tests
      - ./deploy/plugins:/jadawel/plugins
      # dev volumes to avoid polluting your local filesystem with build files or
      # overwriting existing node_modules.
      - node_modules:/jadawel/web-frontend/node_modules
      - nuxt:/jadawel/web-frontend/.nuxt/
      - cache:/jadawel/web-frontend/.cache/
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  storybook:
    image: jadawel_web-frontend:dev
    profiles: ["optional"]
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    command: "storybook-dev"
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:6006:6006"
    volumes:
      - ./web-frontend:/jadawel/web-frontend
      - ./tests/:/jadawel/tests
      - ./deploy/plugins:/jadawel/plugins
      # dev volumes to avoid polluting your local filesystem with build files or
      # overwriting existing node_modules.
      - node_modules:/jadawel/web-frontend/node_modules
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:6006/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-worker"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  celery-export-worker:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-exportworker"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  celery-beat-worker:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-beat"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  celery-flower:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    profiles: ["optional"]
    restart: unless-stopped
    stop_signal: SIGQUIT
    command: "celery-flower"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5555 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      REDIS_HOST:
      REDIS_PORT:
      REDIS_PROTOCOL:
      REDIS_URL:
      REDIS_SSL_CERT_REQS:
      REDIS_SSL_CA_CERTS:
      REDIS_USER:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
      - media:/jadawel/media
    ports:
      - "5555:5555" # web ui
    networks:
      local:
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  mjml-email-compiler:
    image: jadawel_web-frontend:dev
    depends_on:
      - web-frontend
    user: "${UID}:${GID}"
    command: "bash -c 'cd /jadawel/backend/email_compiler/ && yarn install && yarn run watch'"
    healthcheck:
      disable: true
    volumes:
      - ./backend:/jadawel/backend
      - ./web-frontend/docker:/jadawel/web-frontend/docker
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  mailhog:
    image: mailhog/mailhog
    logging:
      driver: "none" # disable saving logs
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:1025:1025" # smtp
      - "8025:8025" # web ui
    networks:
      local:

  # When switching between dev and local the media files in the media volume will be
  # owned by different users. Ensure that we chown them to the user appropriate for the
  # environment here.
  volume-permissions-fixer:
    image: bash:4.4
    command: chown ${UID:-9999}:${GID:-9999}  -R /jadawel/media
    volumes:
      - media:/jadawel/media
      - caddy_config:/config
      - caddy_data:/data
    networks:
      local:

  otel-collector:
    image: otel/opentelemetry-collector:0.106.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      HONEYCOMB_API_KEY:
      HONEYCOMB_METRICS_DATASET: jadawel-dev-metrics
    volumes:
      - $PWD/deploy/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      local:
    ports:
      - "4318:4318"

  embeddings:
    profiles: ["ai"]
    build:
      context: ./embeddings
      dockerfile: Dockerfile
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:7999:80"
    networks:
      local:
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost/health').raise_for_status()",
        ]
      interval: 1m30s
      timeout: 10s
      retries: 3

volumes:
  pgdatadev:
  node_modules:
  nuxt:
  storybook:
  cache:
